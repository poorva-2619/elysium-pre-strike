<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELYSIUM | Deep Space Landing Protocol</title>
  <meta name="description" content="Elysium Pre-Strike Landing Protocol - Chrome Dino Space Runner">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Bungee&family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dedicated Landing Page Enhancements */
    body {
      background: #020617;
      overflow: hidden;
    }
    .landing-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    }
    .postcard-scan-tag {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--color-cyan);
      border-radius: 20px;
      padding: 0.45rem 1.1rem;
      font-family: var(--font-pixel);
      font-size: 0.58rem;
      color: var(--color-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(8px);
    }
    .scan-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38ef7d;
      box-shadow: 0 0 8px #38ef7d;
      animation: pulseDot 1.2s infinite alternate;
    }
    .skip-to-home-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 20;
      background: rgba(225, 29, 72, 0.2);
      border: 1px solid var(--color-red);
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 0.58rem;
      letter-spacing: 1px;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .skip-to-home-btn:hover {
      background: var(--color-red);
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.6);
      transform: translateY(-2px);
    }
    .countdown-timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 3px 10px;
      border-radius: 12px;
      font-family: var(--font-pixel);
      font-size: 0.55rem;
      color: var(--color-cyan);
    }
  </style>
</head>
<body>
  <div class="landing-screen">
    <!-- Postcard Scanner Recognition Banner -->
    <div id="postcardBanner" class="postcard-scan-tag">
      <span class="scan-pulse-dot"></span>
      <span id="postcardScanText">POSTCARD SCAN VALIDATED // THE SKELD INBOUND</span>
    </div>

    <!-- Direct Skip Button to Home -->
    <a href="index.html" class="skip-to-home-btn" id="skipBtn" title="Skip directly to Elysium Home Page">
      <span>ENTER HOME PAGE</span>
      <span>&rarr;</span>
    </a>

    <!-- Ambient Space Backdrop: Cruising spaceships, Saturn & moon, shooting stars -->
    <div class="dino-space-backdrop">
      <div class="cruising-spaceship spaceship-left">
        <svg viewBox="0 0 160 60" class="cruiser-svg">
          <ellipse cx="80" cy="30" rx="70" ry="16" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
          <ellipse cx="80" cy="24" rx="40" ry="8" fill="#00f0ff" opacity="0.6"/>
          <rect x="135" y="27" width="18" height="6" fill="#ff334b" rx="2" class="engine-flare"/>
          <rect x="8" y="28" width="12" height="4" fill="#38ef7d" rx="2"/>
        </svg>
      </div>

      <div class="cruising-spaceship spaceship-right">
        <svg viewBox="0 0 100 40" class="scout-svg">
          <polygon points="10,20 85,8 70,20 85,32" fill="#334155" stroke="#ffbe0b" stroke-width="2"/>
          <circle cx="50" cy="20" r="5" fill="#ffbe0b"/>
          <line x1="10" y1="20" x2="0" y2="20" stroke="#ff334b" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="dino-planet planet-saturn">
        <div class="planet-body"></div>
        <div class="planet-ring"></div>
      </div>
      <div class="dino-planet planet-moon"></div>

      <div class="shooting-star star-1"></div>
      <div class="shooting-star star-2"></div>
      <div class="pixel-starfield"></div>
    </div>

    <!-- Dino Game Interactive / Animated Stage Canvas & Track -->
    <div class="dino-stage-container">
      <!-- Top HUD for Dino Score & Game Vibes -->
      <div class="dino-hud-bar">
        <div class="dino-hi-score">
          <span class="hud-label">HI</span> <span class="hud-num">00426</span> &nbsp;
          <span class="hud-label">SCORE</span> <span id="dinoScore">00000</span>
        </div>
        <div class="countdown-timer-badge">
          <span>REDIRECT IN:</span> <span id="timerSeconds">10s</span>
        </div>
        <div class="dino-mode-tag">PRESS SPACE TO JUMP</div>
      </div>

      <!-- Running Viewport -->
      <div class="dino-viewport">
        <div class="dino-stardust-layer"></div>

        <!-- The Single Among Us Crewmate Running & Auto/Manual Jumping like Chrome Dino -->
        <div id="dinoCrewmate" class="dino-crewmate" title="Press Space or Tap to Jump!">
          <div class="dash-dust"></div>
          <svg viewBox="0 0 100 120" class="dino-crew-svg">
            <rect x="10" y="36" width="20" height="48" rx="9" fill="#9e1328" stroke="#121826" stroke-width="6"/>
            <path d="M 30 32 C 30 12, 78 12, 78 32 L 78 84 C 78 96, 70 106, 62 106 L 57 106 C 53 106, 53 93, 53 88 C 53 93, 49 106, 45 106 L 39 106 C 30 106, 30 94, 30 84 Z" fill="#c51111" stroke="#121826" stroke-width="6"/>
            <ellipse cx="66" cy="42" rx="20" ry="13" fill="#71d3e2" stroke="#121826" stroke-width="5"/>
            <ellipse cx="70" cy="38" rx="13" ry="6" fill="#e0f9fc"/>
            <path d="M 54 14 C 57 2, 70 4, 66 14 Z" fill="#38b000" stroke="#121826" stroke-width="4"/>
          </svg>
        </div>

        <!-- Scrolling Obstacles -->
        <div class="dino-obstacle obstacle-vent" id="obsVent">
          <div class="vent-box">
            <span class="vent-warning">⚠ VENT</span>
          </div>
        </div>

        <div class="dino-obstacle obstacle-asteroid" id="obsAsteroid">
          <div class="asteroid-rock">
            <div class="crater c1"></div>
            <div class="crater c2"></div>
          </div>
        </div>

        <div class="dino-obstacle obstacle-ufo" id="obsUfo">
          <div class="mini-ufo">🛸</div>
        </div>

        <!-- Ground Running Platform -->
        <div class="dino-ground-track">
          <div class="moving-track-stripes"></div>
        </div>
      </div>

      <!-- Bottom Progress Bar & Telemetry Status -->
      <div class="dino-load-footer">
        <div class="load-text-row">
          <span id="preloaderTaskText" class="dino-task-title">VERIFYING POSTCARD CREDENTIALS...</span>
          <span id="preloaderCount" class="dino-percent">0%</span>
        </div>
        <div class="dino-bar-wrapper">
          <div id="preloaderProgress" class="dino-bar-fill"></div>
        </div>
        <div class="dino-tip-row">
          <span class="pixel-star">✦</span>
          <span id="preloaderTipText">Running through deep space asteroid belts... Redirecting to Elysium in 10s!</span>
          <span class="pixel-star">✦</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Check for postcard parameters in URL
      const urlParams = new URLSearchParams(window.location.search);
      const cardId = urlParams.get('card') || urlParams.get('pass');
      const scanText = document.getElementById('postcardScanText');
      if (cardId && scanText) {
        scanText.textContent = `POSTCARD #${cardId} VERIFIED // ACCESSING ELYSIUM BRIDGE`;
      }

      // 2. Audio context for jumping
      let audioCtx = null;
      function playJumpSound() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } catch(e){}
      }

      // 3. Dino Jump logic
      const dinoCrewmate = document.getElementById('dinoCrewmate');
      let isJumping = false;
      function triggerJump() {
        if (isJumping || !dinoCrewmate) return;
        isJumping = true;
        playJumpSound();
        dinoCrewmate.classList.add('jumping');
        setTimeout(() => {
          if (dinoCrewmate) dinoCrewmate.classList.remove('jumping');
          isJumping = false;
        }, 720);
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          triggerJump();
        }
      });
      if (dinoCrewmate) dinoCrewmate.addEventListener('click', triggerJump);

      // Auto jump rhythm
      const autoJumpInterval = setInterval(triggerJump, 2400);

      // 4. Exact 10-Second Loading Progression & Auto-Redirect
      const TOTAL_DURATION_MS = 10000; // Strictly 10 seconds as requested
      const STEP_MS = 100;
      const totalSteps = TOTAL_DURATION_MS / STEP_MS;
      let currentStep = 0;
      let scoreVal = 0;

      const preloaderProgress = document.getElementById('preloaderProgress');
      const preloaderCount = document.getElementById('preloaderCount');
      const preloaderTaskText = document.getElementById('preloaderTaskText');
      const timerSeconds = document.getElementById('timerSeconds');
      const dinoScore = document.getElementById('dinoScore');

      const tasks = [
        { t: 0, msg: "SCANNING POSTCARD DATA MATRIX..." },
        { t: 25, msg: "JUMPING THROUGH ELECTRICAL CONDUITS..." },
        { t: 50, msg: "DODGING CORRIDOR VENTS & UFOS..." },
        { t: 75, msg: "DOCKING AT SKELD OBSERVATION BRIDGE..." },
        { t: 95, msg: "ARRIVAL CONFIRMED! OPENING HOME PAGE..." }
      ];

      const loadTimer = setInterval(() => {
        currentStep++;
        const pct = Math.min(Math.floor((currentStep / totalSteps) * 100), 100);
        const remSec = Math.max(Math.ceil((TOTAL_DURATION_MS - (currentStep * STEP_MS)) / 1000), 0);

        if (preloaderProgress) preloaderProgress.style.width = `${pct}%`;
        if (preloaderCount) preloaderCount.textContent = `${pct}%`;
        if (timerSeconds) timerSeconds.textContent = `${remSec}s`;

        scoreVal += Math.floor(Math.random() * 8) + 4;
        if (dinoScore) dinoScore.textContent = String(scoreVal).padStart(5, '0');

        const active = tasks.slice().reverse().find(task => pct >= task.t);
        if (active && preloaderTaskText) preloaderTaskText.textContent = active.msg;

        if (currentStep >= totalSteps || pct >= 100) {
          clearInterval(loadTimer);
          clearInterval(autoJumpInterval);
          sessionStorage.setItem('fromLanding', 'true');
          // Smooth redirect to the home page of our website
          setTimeout(() => {
            window.location.href = 'index.html?from=landing' + (cardId ? `&card=${cardId}` : '');
          }, 300);
        }
      }, STEP_MS);
    });
  </script>
</body>
</html>
